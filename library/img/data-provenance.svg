<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Be Vietnam Pro,system-ui,sans-serif"><rect width="1200" height="675" fill="#0F1624"/><rect x="60" y="60" width="470" height="80" rx="10" fill="#3FBF8F" fill-opacity=".12" stroke="#3FBF8F"/><text x="82" y="94" fill="#C9D3E0" font-size="19" font-weight="700">Exchange volume</text><text x="82" y="120" fill="#7F8BA0" font-size="14">stocks · crypto · futures</text><line x1="530" x2="620" y1="100" y2="100" stroke="#7F8BA0" stroke-dasharray="5 5"/><text x="640" y="106" fill="#C9D3E0" font-size="17">real traded volume</text><rect x="60" y="162" width="470" height="80" rx="10" fill="#FFB52E" fill-opacity=".12" stroke="#FFB52E"/><text x="82" y="196" fill="#C9D3E0" font-size="19" font-weight="700">Tick volume</text><text x="82" y="222" fill="#7F8BA0" font-size="14">forex · broker CFDs</text><line x1="530" x2="620" y1="202" y2="202" stroke="#7F8BA0" stroke-dasharray="5 5"/><text x="640" y="208" fill="#C9D3E0" font-size="17">count of price changes</text><rect x="60" y="264" width="470" height="80" rx="10" fill="#5EC4D8" fill-opacity=".12" stroke="#5EC4D8"/><text x="82" y="298" fill="#C9D3E0" font-size="19" font-weight="700">Reference volume</text><text x="82" y="324" fill="#7F8BA0" font-size="14">futures volume used for a CFD</text><line x1="530" x2="620" y1="304" y2="304" stroke="#7F8BA0" stroke-dasharray="5 5"/><text x="640" y="310" fill="#C9D3E0" font-size="17">related market, not the CFD</text><rect x="60" y="366" width="470" height="80" rx="10" fill="#B388FF" fill-opacity=".12" stroke="#B388FF"/><text x="82" y="400" fill="#C9D3E0" font-size="19" font-weight="700">Estimated Delta / CVD</text><text x="82" y="426" fill="#7F8BA0" font-size="14">from lower-timeframe candles</text><line x1="530" x2="620" y1="406" y2="406" stroke="#7F8BA0" stroke-dasharray="5 5"/><text x="640" y="412" fill="#C9D3E0" font-size="17">estimate, not bid / ask data</text><rect x="60" y="468" width="470" height="80" rx="10" fill="#D9B062" fill-opacity=".12" stroke="#D9B062"/><text x="82" y="502" fill="#C9D3E0" font-size="19" font-weight="700">Open Interest</text><text x="82" y="528" fill="#7F8BA0" font-size="14">crypto perpetuals</text><line x1="530" x2="620" y1="508" y2="508" stroke="#7F8BA0" stroke-dasharray="5 5"/><text x="640" y="514" fill="#C9D3E0" font-size="17">open contracts</text><text x="40" y="659" fill="#7F8BA0" font-size="15">Illustration · the same word "volume" can mean very different data; know which one your chart is using</text></svg>