<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Be Vietnam Pro,system-ui,sans-serif"><rect width="1200" height="675" fill="#0F1624"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7F8BA0"/></marker></defs><text x="80" y="70" fill="#7F8BA0" font-size="16">Split history: choose settings on one period, confirm on a later one</text><rect x="80" y="90" width="707" height="70" rx="8" fill="#5EC4D8" fill-opacity=".2" stroke="#5EC4D8"/><text x="100" y="133" fill="#C9D3E0" font-size="18" font-weight="700">In-sample (IS) · tune here</text><rect x="793" y="90" width="327" height="70" rx="8" fill="#D9B062" fill-opacity=".2" stroke="#D9B062"/><text x="813" y="133" fill="#C9D3E0" font-size="18" font-weight="700">Out-of-sample (OOS)</text><line x1="360" x2="360" y1="360" y2="575.9999999999997" stroke="#5EC4D8" stroke-width="3"/><rect x="338" y="384.00000000000034" width="44" height="155.99999999999966" fill="#5EC4D8"/><line x1="580" x2="580" y1="287.99999999999983" y2="407.99999999999983" stroke="#5EC4D8" stroke-width="3"/><rect x="558" y="305.99999999999966" width="44" height="78.00000000000068" fill="#5EC4D8"/><text x="360" y="615.9999999999997" fill="#C9D3E0" font-size="16" text-anchor="middle">signal bar · close 102.6</text><text x="580" y="447.99999999999983" fill="#C9D3E0" font-size="16" text-anchor="middle">next bar · fill ≈ 102.6 + slippage</text><line x1="300" x2="700" y1="384.00000000000034" y2="384.00000000000034" stroke="#7F8BA0" stroke-dasharray="6 5"/><rect x="760" y="250" width="360" height="200" rx="10" fill="#0B0E14" stroke="#1E2A3D"/><text x="782" y="292" fill="#C9D3E0" font-size="16">• Size = equity × risk % ÷ SL distance</text><text x="782" y="334" fill="#C9D3E0" font-size="16">• Commission + slippage on every fill</text><text x="782" y="376" fill="#C9D3E0" font-size="16">• 50% TP1 · 50% TP2 (or 50 / 25 / 25)</text><text x="782" y="418" fill="#C9D3E0" font-size="16">• Same signals as the indicator</text><text x="40" y="659" fill="#7F8BA0" font-size="15">Illustration · the Validator turns indicator signals into Strategy Tester orders with sizing and costs</text></svg>