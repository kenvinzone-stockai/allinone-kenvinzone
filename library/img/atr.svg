<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Be Vietnam Pro,system-ui,sans-serif"><rect width="1200" height="675" fill="#0F1624"/><line x1="220" x2="220" y1="407.7" y2="482.9" stroke="#5EC4D8" stroke-width="3"/><rect x="200" y="424.4" width="40" height="33.4" fill="#5EC4D8"/><line x1="380" x2="380" y1="223.9" y2="328.3" stroke="#5EC4D8" stroke-width="3"/><rect x="360" y="240.6" width="40" height="71.0" fill="#5EC4D8"/><line x1="140" x2="420" y1="424.4" y2="424.4" stroke="#7F8BA0" stroke-dasharray="5 5"/><text x="60" y="429.4" fill="#7F8BA0" font-size="14">prev close</text><line x1="450" x2="450" y1="223.9" y2="424.4" stroke="#D9B062" stroke-width="3"/><text x="465" y="329.1" fill="#D9B062" font-size="16" font-weight="700">True Range = 4.8</text><text x="300" y="542.9" fill="#7F8BA0" font-size="15">Here True Range = high − previous close, because of the gap</text><text x="380" y="358.3" fill="#7F8BA0" font-size="14" text-anchor="middle">high − low = 2.5</text><rect x="760" y="140" width="380" height="260" rx="12" fill="#0B0E14" stroke="#1E2A3D"/><text x="785" y="185" fill="#D9B062" font-size="17" font-weight="700">True Range = the largest of:</text><text x="785" y="223" fill="#C9D3E0" font-size="17" font-weight="500">• high − low</text><text x="785" y="261" fill="#C9D3E0" font-size="17" font-weight="500">• |high − previous close|</text><text x="785" y="299" fill="#C9D3E0" font-size="17" font-weight="500">• |low − previous close|</text><text x="785" y="337" fill="#D9B062" font-size="17" font-weight="700">ATR = average True Range</text><text x="785" y="375" fill="#C9D3E0" font-size="17" font-weight="500">over the last N bars (often 14)</text><text x="40" y="659" fill="#7F8BA0" font-size="15">Illustration · True Range includes gaps; ATR averages it to measure how much the market typically moves per bar</text></svg>