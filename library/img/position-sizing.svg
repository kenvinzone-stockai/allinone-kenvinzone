<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Be Vietnam Pro,system-ui,sans-serif"><rect width="1200" height="675" fill="#0F1624"/><rect x="60" y="70" width="1080" height="120" rx="14" fill="#D9B062" fill-opacity=".08" stroke="#D9B062"/><text x="600" y="122" fill="#C9D3E0" font-size="28" font-weight="700" text-anchor="middle">Size = Money at risk ÷ (Stop distance × Value per point)</text><text x="600" y="160" fill="#7F8BA0" font-size="16" text-anchor="middle">money at risk = account × risk % (for example 1%)</text><line x1="60" x2="1140" y1="280" y2="280" stroke="#1E2A3D"/><text x="80" y="266" fill="#7F8BA0" font-size="18" font-weight="700">Market</text><text x="280" y="266" fill="#7F8BA0" font-size="18" font-weight="700">Risk</text><text x="470" y="266" fill="#7F8BA0" font-size="18" font-weight="700">Stop distance</text><text x="690" y="266" fill="#7F8BA0" font-size="18" font-weight="700">Value per unit</text><text x="1000" y="266" fill="#7F8BA0" font-size="18" font-weight="700">Size</text><line x1="60" x2="1140" y1="342" y2="342" stroke="#1E2A3D"/><text x="80" y="328" fill="#C9D3E0" font-size="18" font-weight="500">XAUUSD</text><text x="280" y="328" fill="#C9D3E0" font-size="18" font-weight="500">100 USD</text><text x="470" y="328" fill="#C9D3E0" font-size="18" font-weight="500">12 USD</text><text x="690" y="328" fill="#C9D3E0" font-size="18" font-weight="500">100 USD per lot per 1 USD</text><text x="1000" y="328" fill="#D9B062" font-size="18" font-weight="700">0.08 lot</text><line x1="60" x2="1140" y1="404" y2="404" stroke="#1E2A3D"/><text x="80" y="390" fill="#C9D3E0" font-size="18" font-weight="500">EURUSD</text><text x="280" y="390" fill="#C9D3E0" font-size="18" font-weight="500">100 USD</text><text x="470" y="390" fill="#C9D3E0" font-size="18" font-weight="500">25 pips</text><text x="690" y="390" fill="#C9D3E0" font-size="18" font-weight="500">10 USD per pip per lot</text><text x="1000" y="390" fill="#D9B062" font-size="18" font-weight="700">0.4 lot</text><line x1="60" x2="1140" y1="466" y2="466" stroke="#1E2A3D"/><text x="80" y="452" fill="#C9D3E0" font-size="18" font-weight="500">VN stock</text><text x="280" y="452" fill="#C9D3E0" font-size="18" font-weight="500">1,000,000 ₫</text><text x="470" y="452" fill="#C9D3E0" font-size="18" font-weight="500">1,500 ₫</text><text x="690" y="452" fill="#C9D3E0" font-size="18" font-weight="500">1 share</text><text x="1000" y="452" fill="#D9B062" font-size="18" font-weight="700">600 shares</text><text x="40" y="659" fill="#7F8BA0" font-size="15">Illustration · rounded down to the broker's lot step; leverage changes margin, not the money at risk</text></svg>